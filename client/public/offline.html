<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenseiSystem - Sem Conexão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: #f8fafc;
        }
        
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        
        .button {
            background: #dc2626;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }
        
        .button:hover {
            background: #b91c1c;
        }
        
        .logo {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SenseiSystem</div>
        <div class="icon">📶</div>
        <h1>Sem Conexão</h1>
        <p>Você está offline. Verifique sua conexão com a internet e tente novamente.</p>
        <button class="button" onclick="window.location.reload()">
            Tentar Novamente
        </button>
    </div>
    
    <script>
        // Recarregar automaticamente quando a conexão voltar
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
